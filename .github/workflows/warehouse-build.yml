name: Windows Build (Warehouse)

# Warehouse desktop app. Entry point: lib/main_warehouse.dart.
# Trigger: push a tag like wh-v1.2.5  (git tag wh-v1.2.5 && git push origin wh-v1.2.5).
# Ye tag Branch/Accountant workflows ko trigger nahi karta.

on:
  push:
    tags:
      - 'wh-v*'
  workflow_dispatch:

jobs:
  build-warehouse-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Create .env file
        run: echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows (Warehouse)
        run: flutter build windows --release -t lib/main_warehouse.dart

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-windows-release
          path: build/windows/x64/runner/Release/
          retention-days: 7
