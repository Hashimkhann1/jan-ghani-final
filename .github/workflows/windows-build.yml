name: Windows Build (Branch)

# Branch desktop app. Entry point: lib/main.dart (desktop -> Branch).
# Trigger: push a tag jo 'br' se start ho, jaise br-v1.2.5
#          (git tag br-v1.2.5 && git push origin br-v1.2.5).
# 'acc*' (Accountant web) aur 'ws*' (Warehouse) tags yahan match nahi karte.

on:
  push:
    tags:
      - 'br*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Create .env file
        run: echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env

      - name: Get dependencies
        run: flutter pub get

      - name: Use vendored pdfium (GitHub release download 504 de raha tha)
        shell: pwsh
        run: |
          $local = "${env:GITHUB_WORKSPACE}/third_party/pdfium-win-x64-5200.tgz" -replace '\\','/'
          $cache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          Write-Host "PUB_CACHE = $cache"
          $files = Get-ChildItem -Path "$cache\hosted" -Recurse -Filter CMakeLists.txt |
            Where-Object { $_.FullName -match 'printing-[^\\]+\\windows\\CMakeLists.txt$' }
          foreach ($f in $files) {
            $c = Get-Content $f.FullName -Raw
            $c = $c.Replace('${PDFIUM_URL})', "`"$local`")")
            Set-Content -Path $f.FullName -Value $c -NoNewline
            Write-Host "Patched $($f.FullName)"
          }
          if (-not $files) { Write-Error "printing CMakeLists not found"; exit 1 }

      - name: Build Windows (Branch)
        # printing plugin CMake mein pdfium download karta hai — network flake
        # ho to 3 baar tak retry.
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            flutter build windows --release -t lib/main.dart
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Build attempt $i failed, retrying in 20s..."
            Start-Sleep -Seconds 20
          }
          exit 1

      - name: Create MSIX (Microsoft Store)
        run: dart run msix:create --store --build-windows false

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: branch-windows-msix
          path: build/windows/x64/runner/Release/*.msix
          retention-days: 30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: branch-windows-release
          path: build/windows/x64/runner/Release/
          retention-days: 7
