# Microsoft Store (Branch desktop, lib/main.dart). Build:
#   flutter build windows --release
#   dart run msix:create --store
# TODO: identity_name / publisher / publisher_display_name Partner Center ->
#   Product management -> Product identity se copy karke yahan bharo.
msix_config:
  display_name: Jan Ghani
  publisher_display_name: Shahab Mustafa
  identity_name: ShahabMustafa.JanGhani
  publisher: CN=C1D0CF88-3F3F-484E-B07B-7422AF1A7C2B
  msix_version: 1.0.0.0
  logo_path: assets/images/jan_ghani.png
  capabilities: internetClient,privateNetworkClientServer
  store: true

flutter_launcher_icons:
  android: "launcher_icon"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/web-logo.jpg"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  image_path: "assets/images/web-logo.jpg"
  min_sdk_android: 23
  windows:
    generate: true
    image_path: "assets/images/web-logo.jpg"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/web-logo.jpg"
  web:
    generate: true
    image_path: "assets/images/web-logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/branch_icons/
    - assets/branch_icons/sidebar_icons/
    - assets/json/
#    - .env
